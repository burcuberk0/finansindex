[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"

# ÖNEMLİ: /api/* yolu SPA yönlendirmesinden ÖNCE tanımlanmalı.
# Netlify kuralları sırayla değerlendirir; aksi hâlde aşağıdaki
# yakala-tümü kuralı fonksiyon çağrılarını da index.html'e yönlendirir.
[[redirects]]
  from = "/api/piyasa"
  to = "/.netlify/functions/piyasa"
  status = 200
  force = true

# SPA yönlendirmesi: kalan tüm yollar index.html'e döner
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
