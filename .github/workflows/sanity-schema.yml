name: Sanity semasini yayimla

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'studio/**'

jobs:
  deploy-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Bagimliliklari kur
        working-directory: studio
        run: npm install

      - name: Studio yayimla
        working-directory: studio
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
        run: npx sanity deploy
    
